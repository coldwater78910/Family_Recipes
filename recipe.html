<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recipe • Cook Family Recipes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="Icon.jpg">
</head>
<body class="recipe-page">
    <div class="container">
        <header>
            <a href="Cook Family Recipes.html" class="brand">
                <img src="Icon.jpg" class="logo" alt="Cook Family Recipes logo">
                <div>
                    <div class="brand-title">Cook Family Recipes</div>
                    <div class="brand-sub">Recipe Details</div>
                </div>
            </a>
            <nav aria-label="Main navigation">
                <a href="Cook Family Recipes.html">Home</a>
                <a href="recipes.html">Recipes</a>
                <a href="spice-blends.html">Spice Blends</a>
                <a href="categories.html">Categories</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="about.html">About</a>
            </nav>
        </header>
        <button class="back-link btn btn-inline" onclick="location.href='recipes.html'" type="button">
            	← Back to recipes
        </button>
        <div id="main">
            <!-- Filled by JS -->
        </div>
    </div>

    <script src="recipes-data.js"></script>
    <script>
        // helper to read querystring
        function qs(name){ const params = new URLSearchParams(location.search); return params.get(name) || ''; }
        const title = qs('title');
        const recipe = (window.RECIPES || []).find(r=> r.title === title) || (window.RECIPES || [])[0] || null;
        const main = document.getElementById('main');

        function renderRecipeToMain(r){
            if(!r){
                main.innerHTML = '<p style="color:var(--muted)">Recipe not found.</p>';
                return;
            }
            main.innerHTML = `
                <div class="recipe-thumb" style="background-image:url('${r.img}')" aria-label="${r.title}"></div>
                <h1 style="margin-top:12px">${r.title}</h1>
                <div class="meta"><span>${r.time}</span><span>${r.difficulty}</span></div>
                <div class="tags">${(r.tags||'').split(',').map(t=>`<span class="tag">${t.trim()}</span>`).join('')}</div>
                <div class="content">
                    <p>${r.desc || ''}</p>
                    ${ (r.steps && r.steps.length) ? (`<h3>Steps</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`) : '' }
                </div>
            `;
        }

        // open printable window and trigger print
        function downloadRecipePdf(){
            if(!recipe) return alert('Recipe not found');
            const win = window.open('', '_blank', 'noopener,noreferrer');
            if(!win){ return alert('Please allow pop-ups to print this recipe.'); }

            const styles = `
                <style>
                    body{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; padding:20px; color:#111; background:#fff }
                    .recipe-thumb{ width:100%; height:220px; background-size:cover; background-position:center; margin-bottom:12px }
                    h1{ margin:0 0 8px 0 }
                    .meta{ color:#666; margin-bottom:8px }
                    .tags{ margin-bottom:12px }
                    .content ol{ padding-left:1.2em }
                    img{ max-width:100%; height:auto }
                    .tag{ display:inline-block; background:#efefef; padding:4px 8px; margin-right:6px; border-radius:4px }
                    @media print{ body{ padding:0 } img{ max-width:100% } }
                </style>
            `;

            const safeText = (value = '') => String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            const thumb = recipe.img ? `<img src="${safeText(recipe.img)}" alt="${safeText(recipe.title)} thumbnail">` : '';
            const tags = (recipe.tags || '').split(',').filter(Boolean).map(tag => `<span class="tag">${safeText(tag.trim())}</span>`).join('');
            const stepsHtml = (recipe.steps && recipe.steps.length) ? (`<h3>Steps</h3><ol>${recipe.steps.map(s => `<li>${safeText(s)}</li>`).join('')}</ol>`) : '';

            const doc = `
                <html><head><meta charset="utf-8"><title>${safeText(recipe.title)}</title>${styles}</head>
                <body>
                    <button type="button" onclick="window.print()" style="display:inline-block;margin-bottom:12px;padding:8px 12px;border:none;border-radius:8px;background:#e76f51;color:#fff;font-weight:700;cursor:pointer;">Print / Save as PDF</button>
                    <h1>${safeText(recipe.title)}</h1>
                    <div class="meta">${safeText(recipe.time || '')}${recipe.difficulty ? ' • ' + safeText(recipe.difficulty) : ''}</div>
                    <div class="thumb">${thumb}</div>
                    <div class="tags">${tags}</div>
                    <div class="content">
                        <p>${safeText(recipe.desc || '')}</p>
                        ${stepsHtml}
                    </div>
                </body></html>
            `;

            win.document.open();
            win.document.write(doc);
            win.document.close();

            setTimeout(() => {
                try {
                    win.focus();
                    win.print();
                } catch (e) {
                    console.warn('print failed', e);
                    try {
                        win.document.body.insertAdjacentHTML('afterend', '<div style="padding:12px;text-align:center"><button onclick="window.print()" style="padding:8px 12px;border:none;border-radius:8px;background:#e76f51;color:#fff;font-weight:700;cursor:pointer;">Print / Save as PDF</button></div>');
                    } catch (innerError) {
                        console.warn('fallback print action failed', innerError);
                    }
                }
            }, 500);
        }

        // Initial render
        renderRecipeToMain(recipe);
    </script>

    <!-- Download button placed after scripts so it's available in the header area -->
    <script>
        // add download button near the back-link
        (function(){
            const back = document.querySelector('.back-link');
            if(!back) return;
            const btn = document.createElement('button');
            btn.className = 'btn btn-inline print-button';
            btn.type = 'button';
            btn.title = 'Print recipe';
            btn.setAttribute('aria-label', 'Print recipe');
            btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><path d="M5 12h14a2 2 0 0 1 2 2v4H3v-4a2 2 0 0 1 2-2z"/><path d="M7 17h10v3H7z"/><path d="M7 8h10"/></svg>';
            btn.addEventListener('click', downloadRecipePdf);
            back.after(btn);
        })();
    </script>
</body>
</html>
